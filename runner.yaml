runner:
  name: IP to Bing Search
  description: Queries the Bing Web Search API for the provided IP address.
  version: 0.0.2

build:
  commands: |
    echo "START: Building the runner"
    python3 -m pip install -U -r requirements.txt
    echo "END: Building the runner"

webform:
  - name: ip_address
    prompt: IP Address
    type: text
  - name: api_key
    prompt: Bing API Key
    type: password

launch:
  command: app.py --ip_address ${ip_address} --api_key ${api_key}